<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopOut Character Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="characterCreator" class="hidden">
        <h1>HopOut Character Creator</h1>
        <div class="form-group">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" placeholder="Enter your first name">
        </div>
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <button id="createCharacter">Create Character</button>
        <div id="error" class="hidden">Please fill in all fields</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
